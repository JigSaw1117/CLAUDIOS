<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600">
  <defs>
    <!-- SKY GRADIENT -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- DARK OVERLAY FOR READABILITY -->
    <linearGradient id="overlayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2540" stop-opacity="0.88"/>
      <stop offset="60%" stop-color="#0d3c6c" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#061729" stop-opacity="0.94"/>
    </linearGradient>

    <!-- COLOR BAR GRADIENT (UAC BRAND STRIP) -->
    <linearGradient id="uacBrandBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="25%" stop-color="#48cae4"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="75%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#d62828"/>
    </linearGradient>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="1440" height="600" fill="url(#skyGrad)"/>

  <!-- CLOUDS -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="200" cy="120" rx="90" ry="40"/>
    <ellipse cx="260" cy="100" rx="70" ry="45"/>
    <ellipse cx="140" cy="110" rx="60" ry="35"/>

    <ellipse cx="1200" cy="140" rx="110" ry="50"/>
    <ellipse cx="1280" cy="120" rx="80" ry="45"/>
    <ellipse cx="1130" cy="130" rx="70" ry="40"/>
  </g>

  <!-- UAC CAMPUS BUILDINGS SILHOUETTE -->
  <g fill="#0b3c6d" opacity="0.6">
    <!-- Main Tower -->
    <rect x="250" y="240" width="180" height="300" rx="4"/>
    <!-- Glass Facade Windows -->
    <rect x="270" y="260" width="140" height="240" fill="#38bdf8" opacity="0.4"/>
    <!-- Condor Sign on Building -->
    <rect x="250" y="320" width="180" height="80" fill="#0d3c6c"/>
    <path d="M 340 340 L 350 355 L 365 350 L 355 365 L 360 380 L 340 370 L 320 380 L 325 365 L 315 350 L 330 355 Z" fill="#ffffff"/>
  </g>

  <g fill="#0a2540" opacity="0.5">
    <!-- Side Modern Buildings -->
    <rect x="500" y="280" width="240" height="260" rx="4"/>
    <rect x="520" y="300" width="200" height="220" fill="#7dd3fc" opacity="0.3"/>

    <rect x="800" y="270" width="380" height="270" rx="4"/>
    <rect x="830" y="290" width="320" height="230" fill="#38bdf8" opacity="0.35"/>
  </g>

  <!-- OVERLAY FOR TEXT READABILITY -->
  <rect width="1440" height="600" fill="url(#overlayGrad)"/>
</svg>
